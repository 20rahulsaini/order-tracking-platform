server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page-app fallback: serve index.html for client routes.
    location / {
        try_files $uri /index.html;
    }

    # Proxy /api/orders/* to the Order Service
    location /api/orders/ {
        proxy_pass http://order-service:8081/api/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /api/tracking/* to the Tracking Service
    location /api/tracking/ {
        proxy_pass http://tracking-service:8082/api/tracking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /api/delivery/* to the Delivery Service
    location /api/delivery/ {
        proxy_pass http://delivery-service:8083/api/delivery/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
